<!DOCTYPE html>
<body>
    <canvas id="canvas"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = w, canvas.height = h;
    canvas.style.width = w + "px", canvas.style.height = h + "px";
    document.body.style.margin = "0px", canvas.style.display = "block"
    

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "lightblue";
    ctx.fillRect(0, 0, w, h);

    ctx.fillStyle = "#e8d49a";
    ctx.fillRect(0, h * 0.9, w, h * 0.1);

    const cx = w / 2, cy = h / 2;
    const s = w * 0.03;

    ctx.lineWidth = 3;
    ctx.strokeStyle = "black";

    ctx.beginPath();
    ctx.moveTo(cx - 1.8 * s, cy);
    ctx.lineTo(cx - 3.2 * s, cy - 1.0 * s);
    ctx.lineTo(cx - 3.2 * s, cy + 1.0 * s);
    ctx.closePath();
    ctx.fillStyle = "orange";
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx - 0.6 * s, cy - 1.1 * s);
    ctx.lineTo(cx + 0.2 * s, cy - 2.0 * s);
    ctx.lineTo(cx + 0.9 * s, cy - 1.0 * s);
    ctx.closePath();
    ctx.fillStyle = "orange";
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.ellipse(cx, cy, 2 * s, 1.2 * s, 0, 0, Math.PI * 2);
    ctx.fillStyle = "orange";
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + 1.2 * s, cy - 0.35 * s, 0.25 * s, 0, Math.PI * 2);
    ctx.fillStyle = "white";
    ctx.fill();
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(cx + 1.3 * s, cy - 0.35 * s, 0.1 * s, 0, Math.PI * 2);
    ctx.fillStyle = "black";
    ctx.fill();


</script>
