<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    for (let c = 0; c < 256; c++) {
        let xPos = Math.random() * w;
        let yPos = Math.random() * h;
        let radius = Math.random() * 10;

        ctx.beginPath();
        ctx.arc(xPos, yPos, radius, 0, Math.PI * 2, false);

        if (yPos > h / 2) {
            ctx.fillStyle = "red";
        } else {
            ctx.fillStyle = "green";
        }
        ctx.fill();
    }
</script>
